<!DOCTYPE html>
<html>
<head>
<title>Task Manager</title>
<style>
body { font-family: Arial; background:#f4f6f9; }
.card { background:white; padding:20px; margin:20px; border-radius:10px; }
button { background:#3498db; color:white; padding:8px; border:none; }
input { padding:6px; margin:5px; }
</style>
</head>

<body>

<h2 style="text-align:center;">Task Manager Dashboard</h2>

<div class="card">
<h3>Signup</h3>
<input id="su_u" placeholder="Username">
<input id="su_p" placeholder="Password">
<input id="su_r" placeholder="Role">
<button onclick="signup()">Signup</button>
</div>

<div class="card">
<h3>Login</h3>
<input id="li_u" placeholder="Username">
<input id="li_p" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="card">
<h3>Create Project</h3>
<input id="p_name" placeholder="Project name">
<input id="p_admin" placeholder="Admin ID">
<button onclick="createProject()">Create</button>
</div>

<div class="card">
<h3>Create Task</h3>
<input id="t_title" placeholder="Title">
<input id="t_user" placeholder="User ID">
<input id="t_project" placeholder="Project ID">
<input id="t_admin" placeholder="Admin ID">
<button onclick="createTask()">Create</button>
</div>

<div class="card">
<h3>Dashboard</h3>
<button onclick="loadDashboard()">Load</button>
<div id="dashboard"></div>
</div>

<div class="card">
<h3>Team</h3>
<input id="team_id">
<button onclick="loadTeam()">Load</button>
<div id="team"></div>
</div>

<div class="card">
<h3>Tasks</h3>
<button onclick="loadTasks()">Load</button>
<div id="tasks"></div>
</div>

<script>

const API = "https://task-manager-production-fb8e.up.railway.app";

async function signup(){
    let res = await fetch(`${API}/signup?username=${su_u.value}&password=${su_p.value}&role=${su_r.value}`,{method:"POST"});
    alert(JSON.stringify(await res.json()));
}

async function login(){
    let res = await fetch(`${API}/login?username=${li_u.value}&password=${li_p.value}`,{method:"POST"});
    alert(JSON.stringify(await res.json()));
}

async function createProject(){
    let res = await fetch(`${API}/project?name=${p_name.value}&admin_id=${p_admin.value}`,{method:"POST"});
    alert(JSON.stringify(await res.json()));
}

async function createTask(){
    let res = await fetch(`${API}/task?title=${t_title.value}&user_id=${t_user.value}&project_id=${t_project.value}&admin_id=${t_admin.value}`,{method:"POST"});
    alert(JSON.stringify(await res.json()));
}

async function loadDashboard(){
    let res = await fetch(`${API}/dashboard`);
    let d = await res.json();
    dashboard.innerHTML = `Total: ${d.total_tasks}<br>Done: ${d.completed_tasks}<br>Pending: ${d.pending_tasks}`;
}

async function loadTeam(){
    let res = await fetch(`${API}/project/${team_id.value}/team`);
    let d = await res.json();
    team.innerHTML = d.team_members.join(", ");
}

async function loadTasks(){
    let res = await fetch(`${API}/tasks`);
    let data = await res.json();

    let html = "";
    data.forEach(t=>{
        html += `<p>${t.title} (Project ${t.project_id})</p>`;
    });

    tasks.innerHTML = html;
}

</script>

</body>
</html>
