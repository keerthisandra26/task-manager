<!DOCTYPE html>
<html>
<head>
<title>Task Manager Dashboard</title>

<style>
body { font-family: Arial; background:#f4f6f9; }
.card { background:white; padding:20px; margin:20px; border-radius:10px; }
button { background:#3498db; color:white; padding:8px; }
</style>

</head>

<body>

<h2>Task Manager Dashboard</h2>

<div class="card">
<h3>Signup</h3>
<input id="su_name" placeholder="Username">
<input id="su_pass" placeholder="Password">
<input id="su_role" placeholder="Role">
<button onclick="signup()">Signup</button>
</div>

<div class="card">
<h3>Login</h3>
<input id="li_name" placeholder="Username">
<input id="li_pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="card">
<h3>Create Project</h3>
<input id="p_name" placeholder="Project name">
<input id="p_admin" placeholder="Admin ID">
<button onclick="createProject()">Create</button>
</div>

<div class="card">
<h3>Create Task</h3>
<input id="t_title" placeholder="Task title">
<input id="t_user" placeholder="User ID">
<input id="t_project" placeholder="Project ID">
<input id="t_admin" placeholder="Admin ID">
<button onclick="createTask()">Create Task</button>
</div>

<div class="card">
<h3>Update Task</h3>
<input id="u_id" placeholder="Task ID">
<input id="u_status" placeholder="done/pending">
<button onclick="updateTask()">Update</button>
</div>

<div class="card">
<h3>Delete Task</h3>
<input id="d_id" placeholder="Task ID">
<button onclick="deleteTask()">Delete</button>
</div>

<div class="card">
<h3>Delete User</h3>
<input id="del_user_id" placeholder="User ID">
<button onclick="deleteUser()">Delete</button>
</div>

<div class="card">
<h3>Dashboard</h3>
<button onclick="loadDashboard()">Load</button>
<div id="dashboard"></div>
</div>

<div class="card">
<h3>Team</h3>
<input id="team_id" placeholder="Project ID">
<button onclick="loadTeam()">Load</button>
<div id="team"></div>
</div>

<div class="card">
<h3>Tasks</h3>
<button onclick="loadTasks()">Load</button>
<div id="tasks"></div>
</div>

<script>

const API = "https://task-manager-production-fb8e.up.railway.app";

async function signup(){
    let res = await fetch(`${API}/signup?username=${su_name.value}&password=${su_pass.value}&role=${su_role.value}`,{method:"POST"});
    alert(JSON.stringify(await res.json()));
}

async function login(){
    let res = await fetch(`${API}/login?username=${li_name.value}&password=${li_pass.value}`,{method:"POST"});
    alert(JSON.stringify(await res.json()));
}

async function createProject(){
    let res = await fetch(`${API}/project?name=${p_name.value}&admin_id=${p_admin.value}`,{method:"POST"});
    alert(JSON.stringify(await res.json()));
}

async function createTask(){
    let res = await fetch(`${API}/task?title=${t_title.value}&user_id=${t_user.value}&project_id=${t_project.value}&admin_id=${t_admin.value}`,{method:"POST"});
    alert(JSON.stringify(await res.json()));
}

async function updateTask(){
    let res = await fetch(`${API}/task/${u_id.value}?status=${u_status.value}`,{method:"PUT"});
    alert(JSON.stringify(await res.json()));
}

async function deleteTask(){
    let res = await fetch(`${API}/task/${d_id.value}`,{method:"DELETE"});
    alert(JSON.stringify(await res.json()));
}

async function deleteUser(){
    let res = await fetch(`${API}/user/${del_user_id.value}`,{method:"DELETE"});
    alert(JSON.stringify(await res.json()));
}

async function loadDashboard(){
    let res = await fetch(`${API}/dashboard`);
    let d = await res.json();
    dashboard.innerHTML = `
    Total: ${d.total_tasks}<br>
    Done: ${d.completed_tasks}<br>
    Pending: ${d.pending_tasks}`;
}

async function loadTeam(){
    let res = await fetch(`${API}/project/${team_id.value}/team`);
    let d = await res.json();
    team.innerHTML = d.team_members.length ? d.team_members.join(", ") : "No team";
}

async function loadTasks(){
    let res = await fetch(`${API}/tasks`);
    let data = await res.json();

    tasks.innerHTML = "";
    data.forEach(t => {
        tasks.innerHTML += `<div>${t.title} (${t.status}) [Project ${t.project_id}]</div>`;
    });
}

</script>

</body>
</html>
